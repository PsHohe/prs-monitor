# Temporary: compares the certificate secrets with the local file without printing them.
name: Check certificate secrets
on: workflow_dispatch
jobs:
  check:
    runs-on: macos-14
    steps:
      - env:
          P12: ${{ secrets.MAC_CERT_P12_BASE64 }}
          PASS: ${{ secrets.MAC_CERT_PASSWORD }}
        run: |
          echo "$P12" | base64 --decode > cert.p12
          echo "p12 sha256: $(shasum -a 256 cert.p12 | cut -c1-16)"
          echo "password length: ${#PASS}"
          printf '%s' "$PASS" | LC_ALL=C grep -q '[^[:print:]]' && echo "password has non-printable characters" || echo "password is printable"
          openssl pkcs12 -in cert.p12 -noout -passin env:PASS 2>&1 | tail -1 && echo "openssl: ok" || true
